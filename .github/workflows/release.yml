name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag
        run: |
          version=${GITHUB_REF_NAME#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          scripts/release-notes.sh "$version" >"$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Check
        run: make check
      - name: Build
        run: scripts/build-release.sh "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "gitperch $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" dist/*.tar.gz dist/checksums.txt

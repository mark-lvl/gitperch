name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag
        id: tag
        run: |
          version=${GITHUB_REF_NAME#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          scripts/release-notes.sh "$version" >/dev/null
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Check
        run: make check

  package:
    needs: check
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The archives the package workflow installed and tested.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "gitperch $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" dist/*.tar.gz dist/install.sh dist/checksums.txt
